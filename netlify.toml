# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # camera + xr are needed for "In your room" AR; everything else is off
    Permissions-Policy = "camera=(self), xr-spatial-tracking=(self), microphone=(), geolocation=(), payment=()"

# fonts never change; libraries are pinned versions
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
